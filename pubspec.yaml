name: jasakita
description: Marketplace jasa & manajemen pekerjaan (MVP) - Kelompok 4 Pemrograman Bergerak A.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^7.0.2      # peta OpenStreetMap (tanpa API key)
  latlong2: ^0.9.1
  geolocator: ^13.0.2      # GPS
  image_picker: ^1.1.2     # kamera & galeri
  http: ^1.2.2             # cari alamat (Nominatim)
  google_fonts: ^6.2.1     # font Fraunces & Plus Jakarta Sans

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
